<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Student Verification</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #f4d03f;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="{{url_for('static', filename='images/logo.png')}}" alt="Logo" height="40">
                <span class="fs-5 fw-normal">Bus Pass</span>
            </a>
            <a href="http://127.0.0.1:5000/">
                <button class="btn btn-danger" type="submit">Back</button>
            </a>
        </div>
    </nav>

    <div class="container verification-container text-center">
        <h1>Student Verification</h1>
        <div id="camera-container">
            <video id="video" autoplay></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <p id="cameraText" class="text-secondary">Camera Loading...</p>
        </div>

        <button id="scanButton" class="btn btn-primary">Scan</button>

        <div id="verificationStatus"></div>
        <div id="loader" class="loader"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const verificationStatus = document.getElementById('verificationStatus');
            const scanButton = document.getElementById('scanButton');
            const loader = document.getElementById('loader');
            const cameraText = document.getElementById('cameraText');
            let cameraStream = null;

            // Access the camera
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    cameraStream = stream;
                    cameraText.style.display = 'none'; // Hide "Camera Loading..." message
                })
                .catch(err => {
                    console.error('Camera Error:', err);
                    cameraText.innerText = 'Unable to access the camera. Check permissions or device.';
                });

            scanButton.addEventListener('click', async () => {
                if (!video.srcObject || video.readyState !== 4) {
                    verificationStatus.innerText = "Camera not ready. Please wait.";
                    verificationStatus.style.color = 'red';
                    return;
                }

                loader.style.display = 'block';
                verificationStatus.innerText = "Scanning...";
                verificationStatus.style.color = 'blue';

                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert the captured image to Base64
                const imageData = canvas.toDataURL('image/png');

                try {
                    // Send the captured image to the backend as a JSON object
                    const response = await fetch('/template/student/verification.html', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ image: imageData })
                    });

                    const data = await response.json();
                    loader.style.display = 'none';

                    if (data.verified) {
                        verificationStatus.innerText = data.message;
                        verificationStatus.style.color = 'green';
                    } else {
                        verificationStatus.innerText = data.message || "Verification failed.";
                        verificationStatus.style.color = 'red';
                    }
                } catch (error) {
                    console.error('Error:', error);
                    loader.style.display = 'none';
                    verificationStatus.innerText = "An unexpected error occurred.";
                    verificationStatus.style.color = 'red';
                }
            });


            // Stop the camera when the page is unloaded
            window.addEventListener('beforeunload', () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
            });
        });

    </script>

</body>

</html>
