<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Student</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #f4d03f;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="{{url_for('static', filename='images/logo.png')}}" alt="Logo" height="40">
                <span class="fs-5 fw-normal">Bus Pass</span>
            </a>
            <a href="http://127.0.0.1:5000/">
                <button class="btn btn-danger" type="submit">Back</button>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="row text-center">
            <div class="col-md-6 mb-4">
                <a href="/template/student/register.html"
                    class="btn btn-info admin-student-btn d-flex flex-column align-items-center mp-6 shadow rounded-circle">
                    <img src="{{url_for('static', filename='images/register.png')}}" alt="Admin Icon"
                        class="mb-4 admin-student-icon" height="100">
                    <span class="fs-4 text-bold text-dark">Register</span>
                </a>
            </div>
            <div class="col-md-6 mb-4">
                <a href="/template/student/verification.html"
                    class="btn btn-info admin-student-btn d-flex flex-column align-items-center mp-6 shadow rounded-circle">
                    <img src="{{url_for('static', filename='images/verify.png')}}" alt="Student Icon"
                        class="mb-4 admin-student-icon" height="100">
                    <span class="fs-4 text-bold text-dark">Verify</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
